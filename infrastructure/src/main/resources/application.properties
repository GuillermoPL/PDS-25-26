# ===================================================================
# CONFIGURACIÓN DE LA APLICACIÓN Y RUTA DE LA API
# ===================================================================
spring.application.name=tableros-kanban

# Definimos la base de la API REST (igual que tenías ${tpv.private.api} en el TPV)
# Esto hará que tus endpoints de tableros respondan en: http://localhost:8080/api/v1/tableros
tableros.private.api=/api/v1

# Puerto del servidor embebido de Spring (por si pruebas la API REST con Postman o el navegador)
server.port=8080

# ===================================================================
# CONFIGURACIÓN DE LA BASE DE DATOS (H2 en memoria)
# ===================================================================
# Usamos H2 en memoria RAM (ideal para la práctica porque no requiere instalar nada)
spring.datasource.url=jdbc:h2:mem:kanbandb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Activar la consola web de H2 para que podáis ver las tablas desde el navegador
# Entrando a http://localhost:8080/h2-console con la URL de arriba podréis cotillear la BD
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===================================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ===================================================================
# update: Crea las tablas automáticamente al arrancar basándose en vuestras @Entity de JPA
spring.jpa.hibernate.ddl-auto=update

# Muestra en la consola de Eclipse todas las sentencias SQL reales que ejecuta Spring por detrás
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# CONFIGURACIÓN DE LOGS
# ===================================================================
# Muestra tus mensajes de log.info tanto de la aplicación como del dominio
logging.level.es.um.pds.tableros=INFO
logging.level.org.springframework.web=INFO